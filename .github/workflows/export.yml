name: Export builds

# Builds the Web and Windows presets on every push, so a collaborator gets a
# playable build without installing Godot export templates locally.
#
# Why this exists: the export templates are a 1,222 MB install. Asking every
# collaborator to download that before they can produce a build is a poor
# trade, and on a home connection the download was measured at 14 KB/s - about
# 25 hours. Here it happens on GitHub's infrastructure instead. This repository
# is public, so hosted runner minutes are free and unmetered.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Never let two runs fight over the same branch's artifacts.
concurrency:
  group: export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    name: ${{ matrix.slug }}
    runs-on: ubuntu-latest

    strategy:
      # One preset failing must not hide the other's result, so these run as
      # separate matrix legs rather than sequentially in one job.
      fail-fast: false
      matrix:
        include:
          - preset: Web
            slug: web
            output: build/web/index.html
            # A web export's index.html is only a few KB of HTML shell that
            # loads the real payload. Verifying index.html's size checks
            # nothing. The game lives in the .pck, so that is what gets measured.
            verify_file: build/web/index.pck
            # Every bundle file must exist; the shell is useless without them.
            required_files: build/web/index.html build/web/index.js build/web/index.wasm build/web/index.pck
            min_mb: 50
            artifact_path: build/web
          - preset: Windows Desktop
            slug: windows
            output: build/windows/EMC-Creative-Pathways.exe
            # embed_pck=true, so this single file is the whole game.
            verify_file: build/windows/EMC-Creative-Pathways.exe
            required_files: build/windows/EMC-Creative-Pathways.exe
            min_mb: 50
            artifact_path: build/windows

    steps:
      - name: Check out the project
        uses: actions/checkout@v4
        with:
          # The repository is ~350 MB. A shallow clone is enough to build and
          # keeps the checkout from dominating the run time.
          fetch-depth: 1
          lfs: false

      - name: Set up Godot 4.7.2 with export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          # Must match the engine the project pins. A template built for a
          # different patch version fails in a way that reads like a project
          # problem rather than a setup one.
          version: 4.7.2
          # GDScript only. Pulling the .NET build would add ~200 MB for nothing.
          use-dotnet: false
          # Without this the export has no template to run against.
          include-templates: true
          cache: true

      - name: Record the engine version
        run: |
          godot --headless --version | tee engine_version.txt
          cat engine_version.txt >> "$GITHUB_STEP_SUMMARY"

      # A fresh CI checkout has no .godot/ directory, so no imported assets and
      # no script class cache. Exporting without this step produces a build
      # where every class_name fails to resolve. This is the same trap that
      # made a fresh clone fail 19 of 20 tests locally - see commit 7080be5.
      - name: Import project assets
        run: godot --headless --import

      - name: Export
        run: |
          # Godot does not create the output directory itself.
          mkdir -p "$(dirname "${{ matrix.output }}")"

          # Deliberately not `set -e`: the goal here is to capture Godot's
          # diagnostics, which go to stderr, before deciding anything. GitHub's
          # default shell is `bash -e`, so a bare failure would abort this step
          # and discard the log we came for.
          set +e
          godot --headless --export-release "${{ matrix.preset }}" "${{ matrix.output }}" \
            >export_stdout.txt 2>export_stderr.txt
          code=$?
          set -e
          echo "--- exit code: $code ---"
          echo "--- stdout ---"
          tail -n 60 export_stdout.txt || true
          echo "--- stderr ---"
          cat export_stderr.txt || true

          if [ "$code" -ne 0 ]; then
            # Job logs need an authenticated token to read, but workflow
            # annotations are readable from the public API. Emitting the
            # diagnosis as annotations means a failure can be diagnosed from
            # outside without waiting on someone to read the log.
            # % CR and LF would be interpreted as workflow command syntax.
            sanitize() { printf '%s' "$1" | tr -d '\r' | sed 's/%/%%/g' | cut -c1-240; }
            echo "::error::export of '${{ matrix.preset }}' exited $code"
            grep -Ei 'error|no export template|not found|invalid|unknown|missing' export_stderr.txt \
              | head -n 6 | while IFS= read -r line; do
                echo "::error::$(sanitize "$line")"
              done
            echo "::error::engine reported: $(sanitize "$(godot --headless --version 2>&1 | head -1)")"
            echo "::error::template root contents: $(sanitize "$(ls "$HOME/.local/share/godot/export_templates/" 2>&1 | tr '\n' ' ')")"
            echo "::error::templates for ${{ matrix.slug }}: $(sanitize "$(find "$HOME/.local/share/godot/export_templates" -iname "*${{ matrix.slug }}*" 2>/dev/null | tr '\n' ' ')")"
          fi
          # Still fail the step if Godot reported failure.
          exit $code

      - name: Verify the artifact
        run: |
          # The exit code alone is not trusted. Godot can exit 0 having written
          # nothing, so confirm the real payload exists and is not a stub.
          missing=0
          for f in ${{ matrix.required_files }}; do
            if [ ! -f "$f" ]; then
              echo "::error::missing expected file: $f"
              missing=$((missing+1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "listing what was actually produced:"
            find "${{ matrix.artifact_path }}" -type f 2>/dev/null | head -20 || true
            exit 1
          fi

          target="${{ matrix.verify_file }}"
          size=$(stat -c%s "$target")
          echo "payload: $target - $size bytes"
          min=$(( ${{ matrix.min_mb }} * 1024 * 1024 ))
          if [ "$size" -lt "$min" ]; then
            echo "::error::$target is $size bytes, below the ${{ matrix.min_mb }} MB floor for this project"
            exit 1
          fi

          echo "total built size: $(du -sh "${{ matrix.artifact_path }}" | cut -f1)"
          {
            echo "### ${{ matrix.preset }}"
            echo "- engine: $(cat engine_version.txt)"
            echo "- payload: $target ($size bytes)"
            echo "- total: $(du -sh "${{ matrix.artifact_path }}" | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Flag error-looking lines in the export log
        # Only on failure. Matching /error/ alone also fires on a successful
        # export, because Godot's own progress output mentions error counts.
        if: failure()
        run: |
          if [ ! -f export_stderr.txt ]; then
            echo "no stderr log to inspect"
            exit 0
          fi
          if grep -Ein 'error:|no export template|invalid|unknown option' export_stderr.txt; then
            echo "::warning::the export log contains lines that look like errors - see the step above"
          else
            echo "no error-looking lines in the export log"
          fi

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: emc-creative-pathways-${{ matrix.slug }}
          path: ${{ matrix.artifact_path }}
          retention-days: 30
          # A silently empty upload is worse than a failed one.
          if-no-files-found: error