; Export presets for EMC Creative Pathways.
;
; Regenerated by the Godot editor on save - do not hand-edit while the editor is
; open, or the editor will overwrite these while it is running.
;
; Both presets require the 4.7.2-stable export templates:
;   Editor > Manage Export Templates, or drop the .tpz into
;   %APPDATA%\Godot\export_templates\4.7.2.stable\
;
; CLI equivalents (see .gitignore for the output paths):
;   godot --headless --export-release "Web"            build/web/index.html
;   godot --headless --export-release "Windows Desktop" build/windows/EMC-Creative-Pathways.exe

[preset.0]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/web/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
; Threads are OFF on purpose. Godot's web build uses SharedArrayBuffer for
; threaded rendering, which browsers only expose when the page is served with
; Cross-Origin-Opener-Policy: same-origin and
; Cross-Origin-Embedder-Policy: require-corp. GitHub Pages and itch.io cannot be
; made to send those headers, and a threaded build served without them fails to
; start with a blank screen. Leave this false so the build runs anywhere.
variant/thread_support=false
; Desktop texture compression only. S3TC/BPTC is not available on every web
; device, and for_mobile=true would demand ETC2/ASTC as well.
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
; 2 = Adaptive: the canvas fills the browser window, so the build fits any
; screen size instead of being locked to 1280x720 with black bars.
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
; Installable as a PWA, which is what makes this usable on a phone or tablet at
; a school where installing software is not allowed.
progressive_web_app/enabled=true
; Must stay false: this injects a meta-tag attempt at cross-origin isolation
; that does not work and only produces console errors on a normal static host.
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=0
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0.13, 0.13, 0.16, 1)

[preset.1]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/windows/EMC-Creative-Pathways.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
; Single self-contained .exe. Easiest thing to hand to someone, and the whole
; point of this preset.
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
; Unsigned. Windows SmartScreen will warn on first run because there is no
; certificate; that is expected for a student project and not a defect.
codesign/enable=false
codesign/identity=""
codesign/password=""
codesign/timestamp=true
codesign/timestamp_server_url=""
codesign/digest_algorithm=1
codesign/description=""
codesign/custom_options=PackedStringArray()
application/icon=""
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version="0.1.0"
application/product_version="0.1.0"
application/company_name="BSEMC-DAT"
application/product_name="EMC Creative Pathways"
; The formal title lives here. This is the one place it ships inside a build,
; visible in the .exe Properties dialog on Windows.
application/file_description="EMC Creative Pathways: Promoting Engagement in the BSEMC-DAT Program through Gamified Simulations"
application/copyright=""
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
application/d3d12_agility_sdk_multiarch=true
ssh_remote_deploy/enabled=false
ssh_remote_deploy/host="user@host_ip"
ssh_remote_deploy/port="22"
ssh_remote_deploy/extra_args_ssh=""
ssh_remote_deploy/extra_args_scp=""
ssh_remote_deploy/run_script="#!/usr/bin/env bash\nexport DISPLAY=:0\n\"{temp_dir}/{exe_name}\" {cmd_args}"
ssh_remote_deploy/cleanup_script="#!/usr/bin/env bash\nkill $(pgrep -x -f \"{temp_dir}/{exe_name} {cmd_args}\")\nrm -rf \"{temp_dir}\""